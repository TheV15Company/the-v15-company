/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:

    color:#101828;

a{

}

}


/* =====================================================
   NAVBAR
===================================================== */

}

/* =====================================================
   COMMON SECTIONS
===================================================== */

.section{

.section-inner{

}

.section-header{

}

}

.section-title{

/* =====================================================
   FEATURED CREATORS
===================================================== */

.creators-section{
    background:#f5faff;
}

.creator-carousel{

    position:relative;

    width:100%;

    overflow:hidden;

    touch-action:pan-y;

    user-select:none;
}

.creator-track{

    display:flex;

    transition:
    transform .55s
    cubic-bezier(.22,.61,.36,1);
}

.creator-page{

    min-width:100%;

    padding:8px 5px 20px;

    display:flex;

    flex-direction:column;

    gap:18px;
}

.creator-card{

    position:relative;

    min-height:125px;

    padding:20px;

    background:#fff;

    border:1px solid #dce8f2;

    border-radius:24px;

    display:flex;

    align-items:center;

    gap:17px;

    overflow:hidden;

    box-shadow:
    0 12px 35px
    rgba(26,88,125,.07);
}


/* Moving glow */

.creator-card::before{

    content:"";

    position:absolute;

    inset:0;

    padding:1.5px;

    border-radius:24px;

    background:
    conic-gradient(
        from 0deg,
        transparent 0deg,
        transparent 245deg,
        #72c5f6 285deg,
        #ffffff 315deg,
        #72c5f6 340deg,
        transparent 360deg
    );

    -webkit-mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);

    -webkit-mask-composite:xor;

    mask-composite:exclude;

    animation:
    creatorGlow 3.2s linear infinite;

    pointer-events:none;
}

@keyframes creatorGlow{

    to{
        transform:rotate(360deg);
    }

}

.creator-card::after{

    content:"";

    position:absolute;

    inset:1px;

    border-radius:23px;

    background:#fff;

    z-index:0;
}

.creator-avatar,
.creator-info{
    position:relative;
    z-index:1;
}

.creator-avatar{

    width:78px;
    height:78px;

    flex:0 0 78px;

    border-radius:50%;

    overflow:hidden;

    background:#eaf5fd;

    border:2px solid #b9dcf5;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#2478b8;

    font-size:20px;

    font-weight:900;
}

.creator-avatar img{

    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}

.creator-info{
    min-width:0;
}

.creator-name{

    font-size:18px;

    font-weight:800;

    margin-bottom:5px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.creator-meta{

    color:#667085;

    font-size:14px;

    line-height:1.5;

    margin-bottom:9px;
}

.creator-tag{

    display:inline-block;

    border:1px solid #b9dcf5;

    background:#f2f9ff;

    color:#1769aa;

    border-radius:20px;

    padding:5px 11px;

    font-size:10px;

    font-weight:800;
}

.carousel-controls{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:14px;

    margin-top:12px;
}

.carousel-btn{

    width:44px;
    height:44px;

    border-radius:50%;

    border:1px solid #b9dcf5;

    background:#fff;

    color:#1769aa;

    font-size:20px;

    cursor:pointer;

    transition:.2s ease;
}

.carousel-btn:hover{

    transform:translateY(-2px);
}

    font-size:12px;
